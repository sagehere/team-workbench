name: Test and publish Docker
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DEBUG: "true"
      DEMO_PASSWORD: ci-demo-workbench-password-91
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.lock
      - run: python backend/manage.py check && python backend/manage.py makemigrations --check --dry-run && python backend/manage.py test workbench
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start isolated browser test environment
        run: |
          python backend/manage.py migrate --noinput
          python backend/manage.py demo
          python backend/manage.py collectstatic --noinput
          python backend/manage.py runserver 127.0.0.1:8000 --noreload > /tmp/workbench-server.log 2>&1 &
      - name: Browser tests
        working-directory: frontend
        env:
          E2E_URL: http://127.0.0.1:8000
        run: |
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health/ && break || sleep 1; done
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            frontend/playwright-report
            frontend/test-results
  image:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build native architecture
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: workbench:ci
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=协序 · 中文团队任务工作台
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Verify container and database recovery
        run: python3 scripts/container_smoke.py
      - name: Verify production HTTPS and static files
        run: |
          docker run -d --name production-check -p 127.0.0.1:18081:8000 -e SECRET_KEY=ci-only-production-secret-that-is-not-used-in-real-deployments -e ALLOWED_HOSTS=127.0.0.1,localhost workbench:ci
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:18081/api/health/ && break || sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/)" = 301
          curl -fsS -H 'X-Forwarded-Proto: https' http://127.0.0.1:18081/ | grep '协序'
          docker rm -f production-check
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested architecture
        if: github.event_name != 'pull_request'
        env:
          REPOSITORY: ${{ github.repository }}
          ARCH: ${{ matrix.arch }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}:sha-${GITHUB_SHA}-${ARCH}"
          docker tag workbench:ci "$IMAGE"
          docker push "$IMAGE"
  publish:
    if: github.event_name != 'pull_request'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified multi-architecture manifest
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}"
          TAGS=(--tag "$IMAGE:sha-${GITHUB_SHA}")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAGS+=(--tag "$IMAGE:$VERSION" --tag "$IMAGE:latest")
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            TAGS+=(--tag "$IMAGE:edge")
          fi
          docker buildx imagetools create "${TAGS[@]}" "$IMAGE:sha-${GITHUB_SHA}-amd64" "$IMAGE:sha-${GITHUB_SHA}-arm64"
          docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA}" | tee manifest.txt
          grep -q linux/amd64 manifest.txt
          grep -q linux/arm64 manifest.txt
