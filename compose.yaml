services:
  app:
    image: ghcr.io/sagehere/team-workbench:${IMAGE_TAG:-1.0.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?请在 .env 中设置随机 SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?请在 .env 中设置访问域名}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?请设置含 https 的访问地址}
      TZ: Asia/Shanghai
    volumes:
      - ./data:/app/data
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
